<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="panelGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#052e1c" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad3)"/>

  <g filter="url(#soft3)">
    <rect x="70" y="60" width="660" height="380" rx="18" fill="url(#panelGrad3)"/>
  </g>

  <!-- top bar -->
  <circle cx="98" cy="88" r="6" fill="#475569"/>
  <circle cx="118" cy="88" r="6" fill="#475569"/>
  <circle cx="138" cy="88" r="6" fill="#475569"/>
  <text x="700" y="93" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Daily run · 06:00 · eu-central-1</text>

  <!-- pipeline stages -->
  <g font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
    <rect x="98" y="114" width="100" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="148" y="142" fill="#f8fafc">SMARD API</text>
    <rect x="226" y="114" width="100" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="276" y="142" fill="#fbbf24">Extract</text>
    <rect x="354" y="114" width="100" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="404" y="142" fill="#38bdf8">Transform</text>
    <rect x="482" y="114" width="100" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="532" y="142" fill="#4ade80">Load</text>
    <rect x="610" y="114" width="100" height="46" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="660" y="135" fill="#f8fafc">S3 · Athena</text>
    <text x="660" y="151" fill="#94a3b8" font-weight="normal" font-size="10">PostgreSQL</text>
  </g>
  <g stroke="#64748b" stroke-width="2" marker-end="url(#arrow3)">
    <line x1="200" y1="137" x2="222" y2="137"/>
    <line x1="328" y1="137" x2="350" y2="137"/>
    <line x1="456" y1="137" x2="478" y2="137"/>
    <line x1="584" y1="137" x2="606" y2="137"/>
  </g>

  <!-- chart panel -->
  <rect x="98" y="180" width="612" height="200" rx="10" fill="#111c34"/>
  <text x="114" y="202" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Day-ahead price vs. solar + wind generation</text>

  <!-- generation area (solar + wind) -->
  <path d="M114 360 L114 330 L170 322 L226 300 L282 250 L338 220 L394 232 L450 270 L506 318 L562 330 L618 312 L694 300 L694 360 Z"
        fill="#4ade80" fill-opacity="0.25"/>
  <path d="M114 330 L170 322 L226 300 L282 250 L338 220 L394 232 L450 270 L506 318 L562 330 L618 312 L694 300"
        fill="none" stroke="#4ade80" stroke-width="2"/>

  <!-- price line (inverse) -->
  <path d="M114 240 L170 248 L226 268 L282 314 L338 340 L394 330 L450 296 L506 236 L562 222 L618 244 L694 258"
        fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="338" cy="340" r="5" fill="#fbbf24"/>

  <g font-family="Arial, sans-serif" font-size="11">
    <rect x="560" y="194" width="10" height="10" rx="2" fill="#fbbf24"/>
    <text x="576" y="203" fill="#cbd5e1">Price €/MWh</text>
    <rect x="560" y="210" width="10" height="10" rx="2" fill="#4ade80"/>
    <text x="576" y="219" fill="#cbd5e1">Solar + wind</text>
  </g>

  <text x="98" y="408" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">Python · pandas · PostgreSQL · AWS Lambda · S3 · Athena · Streamlit</text>
</svg>
